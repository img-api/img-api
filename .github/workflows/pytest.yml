name: PyTest
on: push

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # The tests use a throwaway database on localhost (see test/conftest.py)
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      # Same Python as prod (requirements.txt is pinned for 3.11)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q test/unit
